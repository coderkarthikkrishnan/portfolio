  <!-- Enhanced contact form script (replaces old listeners) -->
  <script>
    (function () {
      const oldForm = document.getElementById('contact-form');
      const statusEl = document.getElementById('form-status');
      const submitBtn = document.getElementById('submit');
      if (!oldForm) return;

      // Replace form with a clean clone to remove previous listeners
      const newForm = oldForm.cloneNode(true);
      oldForm.parentNode.replaceChild(newForm, oldForm);

      const SCRIPT_URL = 'https://script.google.com/macros/s/REPLACE_WITH_YOUR_ID/exec';

      function clearErrors() { ['name', 'email', 'phone', 'message'].forEach(id => { const e = document.getElementById(id + '-error'); if (e) e.textContent = '' }); if (statusEl) { statusEl.textContent = ''; statusEl.className = ''; } }
      function showError(id, msg) { const e = document.getElementById(id + '-error'); if (e) e.textContent = msg }
      function focusFirstError() { const ids = ['name', 'email', 'phone', 'message']; for (const id of ids) { const e = document.getElementById(id + '-error'); if (e && e.textContent.trim()) { const f = document.getElementById(id); if (f) f.focus(); break; } } }

      newForm.addEventListener('submit', async function (e) {
        e.preventDefault(); clearErrors();
        const name = (newForm.name && newForm.name.value || '').trim();
        const email = (newForm.email && newForm.email.value || '').trim();
        const phone = (newForm.phone && newForm.phone.value || '').trim();
        const message = (newForm.message && newForm.message.value || '').trim();

        let valid = true;
        if (name.length < 2) { showError('name', 'Please enter your name'); valid = false }
        if (!/^\S+@\S+\.\S+$/.test(email)) { showError('email', 'Please enter a valid email'); valid = false }
        if (!/^[0-9]{10}$/.test(phone)) { showError('phone', 'Enter a 10-digit phone number'); valid = false }
        if (message.length < 6) { showError('message', 'Message is too short'); valid = false }
        if (!valid) { focusFirstError(); return }

        if (SCRIPT_URL.includes('REPLACE_WITH_YOUR_ID')) { if (statusEl) { statusEl.textContent = 'Form not configured — set SCRIPT_URL in the script.'; statusEl.className = 'errors' }; return }

        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Sending...' }
        if (statusEl) { statusEl.textContent = 'Sending...'; statusEl.className = 'muted' }

        const payload = { name, email, phone, message, timestamp: new Date().toISOString() }

        try {
          const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (res && res.ok) { if (statusEl) { statusEl.textContent = 'Message sent — thank you!'; statusEl.className = 'success' }; newForm.reset(); }
          else {
            // try no-cors fallback
            try { await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); if (statusEl) { statusEl.textContent = 'Message sent (no-cors fallback). Check deployment.'; statusEl.className = 'success' }; newForm.reset(); }
            catch (inner) { if (statusEl) { statusEl.textContent = 'Failed to send; server error or CORS.'; statusEl.className = 'errors' }; console.error(inner) }
          }
        } catch (err) { if (statusEl) { statusEl.textContent = 'Network or CORS error. Check script URL and deployment.'; statusEl.className = 'errors' }; console.error(err) }
        finally { if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Send' } }
      });
    })();
  </script>
